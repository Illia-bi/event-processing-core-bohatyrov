name: CI-CD Pipeline

on:
  pull_request:
  push:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          mkdir build
          echo "build success" > build/artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: build/

  deploy_staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Deploy to staging
        run: |
          echo "STAGING DEPLOY"
          cat build/artifact.txt

  verify_staging:
    needs: deploy_staging
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          python -c "assert 1 == 1"

  deploy_production:
    needs: verify_staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Deploy to production
        run: |
          echo "PRODUCTION DEPLOY"
          cat build/artifact.txt
